<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loughery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #333;
    }
    p {
      font-size: 1.2em;
      color: #666;
    }

    .login-box {
      margin-top: 40px;
    }

    input {
      display: block;
      margin: 8px auto;
      padding: 8px;
      width: 220px;
      font-size: 0.95em;
    }

    button {
      padding: 8px 18px;
      background: #0077cc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #005fa3;
    }

    .copyright {
      margin-top: 30px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>

  <h1>Loughery.com</h1>

  <div class="login-box">
    <input type="text" placeholder="Username" />
    <input type="password" placeholder="Password" />
    <button onclick="window.location.href='https://login.microsoftonline.com/'">
      Login
    </button>
  </div>

  <p class="copyright">&copy; 2002-2026</p>

</body>
</html>
