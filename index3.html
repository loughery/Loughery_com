<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loughery Professional Services, LLC.</title>

<style>

/* ===== BACKGROUND ===== */
body {
  margin: 0;
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #e6edf3;
  background: radial-gradient(circle at 30% 30%, #1c2430, #0f141a 70%);
  position: relative;
  overflow: hidden;
}

body::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 3px 3px;
  opacity: .35;
  pointer-events: none;
}

/* ===== GLASS CONTAINER ===== */
.container {
  position: relative;
  padding: 65px 55px;
  width: min(92%, 500px);
  border-radius: 20px;
  backdrop-filter: blur(18px);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow:
    0 30px 80px rgba(0,0,0,0.45),
    inset 0 0 25px rgba(255,255,255,0.03);
  text-align: center;
  animation: cardFade 1.2s ease forwards;
  opacity: 0;
  transform: translateY(10px);
}

/* Micro fade-in */
@keyframes cardFade {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===== Animated Accent Line ===== */
.accent {
  position: relative;
  height: 3px;
  width: 0;
  margin: 0 auto 38px auto;
  border-radius: 3px;
  background: linear-gradient(90deg, #4aa3ff, #6be4ff);
  animation: growLine 2.4s ease forwards, glowPulse 3.5s ease-in-out infinite;
  overflow: hidden;
}

@keyframes growLine {
  from { width: 0; }
  to { width: 160px; }
}

/* Glow pulse */
@keyframes glowPulse {
  0%,100% { box-shadow: 0 0 6px rgba(74,163,255,.4); }
  50% { box-shadow: 0 0 18px rgba(74,163,255,.8); }
}

/* Shimmer sweep */
.accent::after {
  content: "";
  position: absolute;
  top: 0;
  left: -40%;
  width: 40%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.6),
    transparent
  );
  animation: shimmer 4s ease-in-out infinite;
}

@keyframes shimmer {
  0% { left: -40%; }
  50% { left: 120%; }
  100% { left: 120%; }
}

/* ===== Title ===== */
h1 {
  font-weight: 500;
  font-size: clamp(18px, 2.6vw, 26px);
  letter-spacing: 0.06em;
  margin: 0 0 44px 0;
  white-space: nowrap;
  color: #ffffff;
}

/* ===== Inputs ===== */
input {
  width: 100%;
  padding: 14px;
  margin-bottom: 24px;
  font-size: 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06);
  color: #ffffff;
  transition: all .25s ease;
}

input::placeholder {
  color: rgba(255,255,255,.5);
}

input:focus {
  outline: none;
  border-color: #4aa3ff;
  box-shadow: 0 0 0 3px rgba(74,163,255,.25);
}

/* ===== Buttons ===== */
.button-row {
  display: flex;
  gap: 16px;
}

button {
  flex: 1;
  padding: 14px 0;
  font-size: 14px;
  border-radius: 12px;
  cursor: pointer;
  transition: all .25s ease;
}

/* Primary */
.login-btn {
  background: linear-gradient(135deg, #4aa3ff, #2f80ed);
  color: white;
  border: none;
  box-shadow: inset 0 0 10px rgba(255,255,255,.15);
}

.login-btn:hover {
  box-shadow:
    inset 0 0 14px rgba(255,255,255,.25),
    0 12px 28px rgba(74,163,255,.45);
  transform: translateY(-2px);
}

/* Ghost secondary */
.clear-btn {
  background: transparent;
  color: #c9d1d9;
  border: 1px solid rgba(255,255,255,0.25);
}

.clear-btn:hover {
  background: rgba(255,255,255,0.08);
  border-color: #4aa3ff;
  color: #ffffff;
  transform: translateY(-2px);
}

/* ===== Footer ===== */
.footer {
  margin-top: 60px;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,.5);
}

/* ===== PRINT VERSION ===== */
@media print {
  body {
    background: #ffffff !important;
    color: #000000 !important;
  }

  body::before {
    display: none;
  }

  .container {
    backdrop-filter: none;
    background: #ffffff;
    border: 1px solid #ddd;
    box-shadow: none;
  }

  h1 {
    color: #000000;
  }

  input, button {
    display: none;
  }

  .footer {
    color: #000000;
  }
}

</style>
</head>

<body>

<div class="container">

  <div class="accent"></div>

  <h1>Loughery Professional Services, LLC.</h1>

  <input type="text" id="username" placeholder="Email or username" />
  <input type="password" id="password" placeholder="Password" />

  <div class="button-row">
    <button class="login-btn"
      onclick="window.location.href='https://login.microsoftonline.com/'">
      Sign in
    </button>

    <button class="clear-btn" onclick="clearFields()">
      Clear
    </button>
  </div>

  <div class="footer">
    &copy; 2002–2026&nbsp;&nbsp;&nbsp;&nbsp;Loughery.com
  </div>

</div>

<script>
function clearFields() {
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
}
</script>

</body>
</html>
