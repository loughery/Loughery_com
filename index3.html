<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loughery Professional Services, LLC.</title>

<style>

/* ===== BACKGROUND ===== */
body {
  margin: 0;
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #e6edf3;
  background: radial-gradient(circle at 30% 30%, #1c2430, #0f141a 70%);
  position: relative;
}

body::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 3px 3px;
  opacity: .4;
  pointer-events: none;
}

/* ===== GLASS CONTAINER ===== */
.container {
  position: relative;
  padding: 60px 50px;
  width: min(92%, 480px);
  border-radius: 18px;
  backdrop-filter: blur(14px);
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  text-align: center;
}

/* ===== Animated Accent Line ===== */
.accent {
  height: 3px;
  width: 0;
  margin: 0 auto 36px auto;
  border-radius: 3px;
  background: linear-gradient(90deg, #4aa3ff, #6be4ff);
  animation: growLine 1.2s ease forwards;
}

@keyframes growLine {
  from { width: 0; }
  to { width: 80px; }
}

/* ===== Title ===== */
h1 {
  font-weight: 500;
  font-size: clamp(18px, 2.6vw, 26px);
  letter-spacing: 0.06em;
  margin: 0 0 42px 0;
  white-space: nowrap;
  color: #ffffff;
}

/* ===== Inputs ===== */
input {
  width: 100%;
  padding: 13px;
  margin-bottom: 22px;
  font-size: 14px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.05);
  color: #ffffff;
  transition: all .25s ease;
}

input::placeholder {
  color: rgba(255,255,255,.5);
}

input:focus {
  outline: none;
  border-color: #4aa3ff;
  box-shadow: 0 0 0 3px rgba(74,163,255,.2);
}

/* ===== Buttons ===== */
.button-row {
  display: flex;
  gap: 14px;
}

button {
  flex: 1;
  padding: 13px 0;
  font-size: 14px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  transition: all .25s ease;
  position: relative;
  overflow: hidden;
}

/* ===== Ripple Effect ===== */
button::after {
  content: "";
  position: absolute;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
  transform: translate(-50%, -50%);
  pointer-events: none;
}

button:active::after {
  width: 200%;
  height: 200%;
  transition: width .4s ease, height .4s ease;
}

/* ===== Primary ===== */
.login-btn {
  background: linear-gradient(135deg, #4aa3ff, #2f80ed);
  color: white;
  box-shadow: inset 0 0 8px rgba(255,255,255,.15);
}

.login-btn:hover {
  box-shadow:
    inset 0 0 12px rgba(255,255,255,.2),
    0 10px 25px rgba(74,163,255,.4);
  transform: translateY(-2px);
}

/* ===== Secondary ===== */
.clear-btn {
  background: linear-gradient(135deg, #2c3642, #1f2731);
  color: #c9d1d9;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: inset 0 0 6px rgba(255,255,255,.05);
}

.clear-btn:hover {
  background: linear-gradient(135deg, #364152, #273140);
  box-shadow:
    inset 0 0 10px rgba(255,255,255,.08),
    0 8px 18px rgba(0,0,0,.35);
  transform: translateY(-2px);
}

/* ===== Footer ===== */
.footer {
  margin-top: 55px;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,.5);
}

/* ===== PRINT VERSION ===== */
@media print {
  body {
    background: #ffffff !important;
    color: #000000 !important;
  }

  body::before {
    display: none;
  }

  .container {
    backdrop-filter: none;
    background: #ffffff;
    border: 1px solid #ddd;
    box-shadow: none;
  }

  h1 {
    color: #000000;
  }

  input, button {
    display: none;
  }

  .footer {
    color: #000000;
  }
}

</style>
</head>

<body>

<div class="container">

  <div class="accent"></div>

  <h1>Loughery Professional Services, LLC.</h1>

  <input type="text" id="username" placeholder="Email or username" />
  <input type="password" id="password" placeholder="Password" />

  <div class="button-row">
    <button class="login-btn"
      onclick="window.location.href='https://login.microsoftonline.com/'">
      Sign in
    </button>

    <button class="clear-btn" onclick="clearFields()">
      Clear
    </button>
  </div>

  <div class="footer">
    &copy; 2002–2026&nbsp;&nbsp;&nbsp;&nbsp;Loughery.com
  </div>

</div>

<script>
function clearFields() {
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
}
</script>

</body>
</html>
