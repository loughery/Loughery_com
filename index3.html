<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loughery Professional Services, LLC</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: #1f1f1f;
}

.container {
  background: #ffffff;
  padding: 50px 40px;
  width: min(92%, 440px);
  border-radius: 4px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.05);
  text-align: center;
}

/* Thin corporate accent line */
.accent {
  height: 2px;
  width: 48px;
  background: #1f3a5f;
  margin: 0 auto 28px auto;
}

/* Elegant scaling title */
h1 {
  font-weight: 500;
  font-size: clamp(18px, 2.8vw, 24px);
  letter-spacing: 0.04em;
  margin: 0 0 36px 0;
  white-space: nowrap;
}

/* Inputs */
input {
  width: 100%;
  padding: 11px;
  margin-bottom: 18px;
  font-size: 14px;
  border: 1px solid #d2d2d2;
  border-radius: 3px;
  background: #fafafa;
  transition: border .2s ease;
}

input:focus {
  outline: none;
  border-color: #1f3a5f;
  background: #ffffff;
}

/* Buttons */
.button-row {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  padding: 11px 0;
  font-size: 14px;
  border-radius: 3px;
  border: none;
  cursor: pointer;
  transition: background .2s ease;
}

.login-btn {
  background: #1f3a5f;
  color: white;
}

.login-btn:hover {
  background: #162b46;
}

.clear-btn {
  background: #e6e6e6;
  color: #333;
}

.clear-btn:hover {
  background: #d8d8d8;
}

/* Footer */
.footer {
  margin-top: 40px;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: #777;
}
</style>
</head>

<body>

<div class="container">

  <div class="accent"></div>

  <h1>Loughery Professional Services, LLC</h1>

  <input type="text" id="username" placeholder="Email or username" />
  <input type="password" id="password" placeholder="Password" />

  <div class="button-row">
    <button class="login-btn"
      onclick="window.location.href='https://login.microsoftonline.com/'">
      Sign in
    </button>

    <button class="clear-btn" onclick="clearFields()">
      Clear
    </button>
  </div>

  <div class="footer">
    &copy; 2002–2026&nbsp;&nbsp;&nbsp;&nbsp;Loughery.com
  </div>

</div>

<script>
function clearFields() {
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
}
</script>

</body>
</html>
