<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loughery Professional Services, LLC</title>

<style>

/* ===== BACKGROUND ===== */
body {
  margin: 0;
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #e6edf3;
  background: radial-gradient(circle at 30% 30%, #1c2430, #0f141a 70%);
  position: relative;
  overflow: hidden;
}

/* Subtle tech texture */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 3px 3px;
  opacity: .35;
  pointer-events: none;
}

/* ===== Ambient Glow Behind Card ===== */
body::after {
  content: "";
  position: absolute;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(74,163,255,.25), transparent 70%);
  filter: blur(80px);
  animation: floatGlow 8s ease-in-out infinite alternate;
  pointer-events: none;
}

@keyframes floatGlow {
  from { transform: translate(-40px, -20px); opacity: .6; }
  to   { transform: translate(40px, 20px); opacity: .8; }
}

/* ===== GLASS CONTAINER ===== */
.container {
  position: relative;
  padding: 65px 55px;
  width: min(92%, 500px);
  border-radius: 20px;
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.09);
  border: 1px solid rgba(255,255,255,0.14);
  box-shadow:
    0 30px 90px rgba(0,0,0,0.5),
    inset 0 0 30px rgba(255,255,255,0.04);
  text-align: center;
  animation: cardFade 1.2s ease forwards;
  opacity: 0;
  transform: translateY(10px);
}

@keyframes cardFade {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===== Accent Line ===== */
.accent {
  position: relative;
  height: 3px;
  width: 160px;
  margin: 0 auto 38px auto;
  border-radius: 3px;
  background: linear-gradient(90deg, #4aa3ff, #6be4ff);
  animation: glowPulse 3.5s ease-in-out infinite;
}

@keyframes glowPulse {
  0%,100% { box-shadow: 0 0 6px rgba(74,163,255,.4); }
  50% { box-shadow: 0 0 20px rgba(74,163,255,.8); }
}

/* ===== Title ===== */
h1 {
  font-weight: 500;
  font-size: clamp(18px, 2.6vw, 26px);
  letter-spacing: 0.06em;
  margin: 0 0 44px 0;
  white-space: nowrap;
  color: #ffffff;
}

/* ===== Inputs ===== */
input {
  width: 100%;
  padding: 14px;
  margin-bottom: 24px;
  font-size: 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06);
  color: #ffffff;
  transition: all .25s ease;
}

input::placeholder {
  color: rgba(255,255,255,.5);
}

input:focus {
  outline: none;
  border-color: #4aa3ff;
  box-shadow: 0 0 0 3px rgba(74,163,255,.25);
}

/* ===== Buttons ===== */
.button-row {
  display: flex;
  gap: 16px;
}

button {
  flex: 1;
  padding: 14px 0;
  font-size: 14px;
  border-radius: 12px;
  cursor: pointer;
  transition: all .25s ease;
}

/* Primary */
.login-btn {
  background: linear-gradient(135deg, #4aa3ff, #2f80ed);
  color: white;
  border: none;
  box-shadow: inset 0 0 12px rgba(255,255,255,.2);
}

.login-btn:hover {
  box-shadow:
    inset 0 0 16px rgba(255,255,255,.25),
    0 14px 30px rgba(74,163,255,.45);
  transform: translateY(-2px);
}

/* Improved Clear Button (cool steel blue tone) */
.clear-btn {
  background: linear-gradient(135deg, #3a4655, #2c3642);
  color: #d6dde6;
  border: 1px solid rgba(255,255,255,0.18);
}

.clear-btn:hover {
  background: linear-gradient(135deg, #455364, #354252);
  box-shadow: 0 10px 20px rgba(0,0,0,.35);
  transform: translateY(-2px);
}

/* ===== Footer ===== */
.footer {
  margin-top: 60px;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,.5);
}

/* ===== PRINT ===== */
@media print {
  body {
    background: #ffffff !important;
    color: #000000 !important;
  }

  body::before,
  body::after {
    display: none;
  }

  .container {
    backdrop-filter: none;
    background: #ffffff;
    border: 1px solid #ddd;
    box-shadow: none;
  }

  h1 { color: #000000; }
  input, button { display: none; }
  .footer { color: #000000; }
}

</style>
</head>

<body>

<div class="container">

  <div class="accent"></div>

  <h1>Loughery Professional Services, LLC</h1>

  <input type="text" placeholder="Email or username" />
  <input type="password" placeholder="Password" />

  <div class="button-row">
    <button class="login-btn"
      onclick="window.location.href='https://login.microsoftonline.com/'">
      Sign in
    </button>

    <button class="clear-btn">
      Clear
    </button>
  </div>

  <div class="footer">
    &copy; 2002–2026&nbsp;&nbsp;&nbsp;&nbsp;Loughery.com
  </div>

</div>

</body>
</html>
