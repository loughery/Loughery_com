<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loughery Group</title>

<style>
 
*{box-sizing:border-box}

body{
margin:0;
font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif;
background:#ffffff;
color:#1b1b1b;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:24px;
}

.container{
width:100%;
max-width:520px;
padding:clamp(28px,6vw,60px);
border-radius:18px;
background:#ffffff;
border:1px solid #c8c8c8;
box-shadow:0 18px 40px rgba(0,0,0,0.08);
text-align:center;
animation:cardFade 1s ease forwards;
opacity:0;
transform:translateY(6px);
}

@keyframes cardFade{
to{opacity:1;transform:translateY(0)}
}

.accent{
height:3px;
width:0;
margin:0 auto 32px auto;
border-radius:3px;
background:linear-gradient(90deg,#0078d4,#4aa3ff);
animation:growLine 2s ease forwards;
}

@keyframes growLine{
from{width:0}
to{width:160px}
}

h1{
font-family:"Inter","Segoe UI Variable",system-ui,sans-serif;
font-weight:600;
font-size:clamp(22px,4vw,28px);
letter-spacing:.06em;
line-height:1.2;
}

input{
width:100%;
padding:14px;
margin-bottom:20px;
font-size:15px;
border-radius:8px;
border:1px solid #dcdcdc;
background:#fafafa;
}

.button-row{
display:flex;
gap:16px;
}

button{
flex:1;
padding:14px 0;
font-size:15px;
border-radius:8px;
cursor:pointer;
transition:.25s;
border:none;
}

.login-btn{
background:#0078d4;
color:white;
}

.login-btn:hover{
box-shadow:0 8px 18px rgba(0,120,212,.3);
transform:translateY(-1px);
}

.m365-btn{
margin-top:16px;
width:100%;
padding:14px;
background:linear-gradient(135deg,#0078d4,#005fa3);
color:white;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

.m365-btn:hover{
box-shadow:0 8px 18px rgba(0,120,212,.3);
transform:translateY(-1px);
}

.clear-btn{
background:#f2f2f2;
color:#444;
border:1px solid #d0d0d0;
}

.or-divider{
margin:22px 0;
font-size:13px;
letter-spacing:.18em;
color:#777;
}

.footer-divider{
width:60%;
height:1px;
margin:48px auto 16px auto;
background:#e0e0e0;
}

.footer{
font-size:12px;
letter-spacing:.08em;
color:#666;
}

.rights{
margin-top:6px;
font-size:12px;
letter-spacing:.08em;
color:#999;
}

.timestamp{
margin-top:26px;
padding-top:14px;
font-size:11px;
font-style:italic;
color:#777;
text-align:center;
align-self:center;
width:100%;
max-width:520px;
position:relative;
}

/* subtle divider above timestamp */

.timestamp::before{
content:"";
display:block;
width:120px;
height:1px;
background:#e4e4e4;
margin:0 auto 10px auto;
}

/* dialog */

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
align-items:center;
justify-content:center;
}

.modal-content{
background:white;
padding:28px;
border-radius:10px;
max-width:360px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.modal-content p{
margin-bottom:20px;
}

.modal-content button{
width:100%;
background:#0078d4;
color:white;
padding:12px;
border-radius:6px;
}

@media(max-width:600px){

body{
align-items:flex-start;
padding-top:60px;
}

.button-row{
flex-direction:column;
}

}

</style>
</head>

<body>

<div class="container">

<div class="accent"></div>

<h1>The Loughery Group</h1>

<form autocomplete="off">

<!-- dummy field to absorb autofill -->
<input type="text" style="display:none">

<input
type="text"
name="user_field"
placeholder="Email or username"
autocomplete="off"
autocorrect="off"
autocapitalize="none"
spellcheck="false">

<input
type="password"
name="pass_field"
placeholder="Password"
autocomplete="new-password"
autocorrect="off"
autocapitalize="none"
spellcheck="false">

<div class="button-row">

<button type="button" class="login-btn" onclick="showDialog()">
Login
</button>

<button type="button" class="clear-btn" onclick="clearFields()">
Clear
</button>

</div>

</form>

<div class="or-divider">— OR —</div>

<button class="m365-btn"
onclick="window.location.href='https://login.microsoftonline.com/'">
Sign in with Microsoft 365
</button>

<div class="footer-divider"></div>

<div class="footer">
&copy; 2002–2026&nbsp;&nbsp;&nbsp;&nbsp;Loughery.com
</div>

<div class="rights">
All Rights Reserved
</div>

</div>

<div class="timestamp" id="lastModified"></div>

<!-- modal -->

<div class="modal" id="modal">
<div class="modal-content">
<p>Local login is not enabled for this device..<br><br>
Please sign in using Microsoft 365.</p>

<button onclick="closeDialog()">Close</button>
</div>
</div>

<script>

function clearFields(){
document.querySelectorAll("input").forEach(i=>i.value="")
}

function showDialog(){
document.getElementById("modal").style.display="flex"
}

function closeDialog(){
document.getElementById("modal").style.display="none"
}

const lastModified=new Date(document.lastModified)

const formatter=new Intl.DateTimeFormat('en-US',{
timeZone:'America/New_York',
month:'short',
day:'2-digit',
year:'numeric',
hour:'numeric',
minute:'2-digit',
hour12:true,
timeZoneName:'short'
})

const parts=formatter.formatToParts(lastModified)

let v={}
parts.forEach(p=>v[p.type]=p.value)

const formatted=`${v.month} ${v.day}, ${v.year} — ${v.hour}:${v.minute} ${v.dayPeriod} ${v.timeZoneName}`

document.getElementById("lastModified").textContent="Last update: "+formatted

</script>

</body>
</html>
