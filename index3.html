<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loughery Professional Services, LLC.</title>

<style>

/* ===== MICROSOFT FONT STACK ===== */
body {
  margin: 0;
  font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #e6edf3;
  background: radial-gradient(circle at 30% 30%, #1c2430, #0f141a 70%);
  position: relative;
  overflow: hidden;
}

/* subtle texture */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 4px 4px;
  opacity: .25;
  pointer-events: none;
}

/* restrained ambient glow */
body::after {
  content: "";
  position: absolute;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(74,163,255,.18), transparent 70%);
  filter: blur(100px);
  animation: floatGlow 14s ease-in-out infinite alternate;
  pointer-events: none;
}

@keyframes floatGlow {
  from { transform: translate(-30px, -15px); opacity: .5; }
  to   { transform: translate(30px, 15px); opacity: .65; }
}

/* ===== GLASS CARD ===== */
.container {
  position: relative;
  padding: 65px 55px;
  width: min(92%, 500px);
  border-radius: 20px;
  backdrop-filter: blur(18px);
  background: rgba(255,255,255,0.085);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow:
    0 25px 70px rgba(0,0,0,0.45),
    inset 0 0 25px rgba(255,255,255,0.03);
  text-align: center;
  animation: cardFade 1.4s ease forwards;
  opacity: 0;
  transform: translateY(6px);
}

@keyframes cardFade {
  to { opacity: 1; transform: translateY(0); }
}

/* ===== FULL RESTORED ACCENT LINE ===== */
.accent {
  position: relative;
  height: 3px;
  width: 0;
  margin: 0 auto 40px auto;
  border-radius: 3px;
  background: linear-gradient(90deg, #4aa3ff, #6be4ff);
  animation:
    growLine 2.6s ease forwards,
    glowPulse 4s ease-in-out infinite;
  overflow: hidden;
}

@keyframes growLine {
  from { width: 0; }
  to { width: 160px; }
}

/* subtle glow pulse */
@keyframes glowPulse {
  0%,100% { box-shadow: 0 0 6px rgba(74,163,255,.35); }
  50% { box-shadow: 0 0 16px rgba(74,163,255,.55); }
}

/* shimmer sweep */
.accent::after {
  content: "";
  position: absolute;
  top: 0;
  left: -40%;
  width: 40%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.5),
    transparent
  );
  animation: shimmer 7s ease-in-out infinite;
}

@keyframes shimmer {
  0% { left: -40%; }
  55% { left: 120%; }
  100% { left: 120%; }
}

/* ===== HEADER ===== */
h1 {
  font-weight: 600;
  font-size: clamp(18px, 2.6vw, 24px);
  letter-spacing: 0.04em;
  margin: 0 0 44px 0;
  white-space: nowrap;
  color: #ffffff;
}

/* ===== INPUTS ===== */
input {
  width: 100%;
  padding: 14px;
  margin-bottom: 24px;
  font-size: 14px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.05);
  color: #ffffff;
  transition: all .25s ease;
}

input::placeholder { color: rgba(255,255,255,.5); }

input:focus {
  outline: none;
  border-color: #4aa3ff;
  box-shadow: 0 0 0 3px rgba(74,163,255,.18);
}

/* ===== BUTTONS ===== */
.button-row { display: flex; gap: 16px; }

button {
  flex: 1;
  padding: 14px 0;
  font-size: 14px;
  border-radius: 10px;
  cursor: pointer;
  transition: all .25s ease;
}

.login-btn {
  background: linear-gradient(135deg, #4aa3ff, #2f80ed);
  color: white;
  border: none;
}

.login-btn:hover {
  box-shadow: 0 10px 24px rgba(74,163,255,.35);
  transform: translateY(-1px);
}

.clear-btn {
  background: linear-gradient(135deg, #3a4655, #2c3642);
  color: #d6dde6;
  border: 1px solid rgba(255,255,255,0.18);
}

.clear-btn:hover {
  background: linear-gradient(135deg, #455364, #354252);
  box-shadow: 0 8px 18px rgba(0,0,0,.3);
  transform: translateY(-1px);
}

/* ===== FOOTER ===== */
.footer {
  margin-top: 60px;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,.45);
}

/* ===== PRINT ===== */
@media print {
  body { background: #ffffff !important; color: #000000 !important; }
  body::before, body::after { display: none; }
  .container { backdrop-filter: none; background: #ffffff; box-shadow: none; }
  h1 { color: #000000; }
  input, button { display: none; }
  .footer { color: #000000; }
}

</style>
</head>

<body>

<div class="container">

  <div class="accent"></div>

  <h1>Loughery Professional Services, LLC.</h1>

  <input type="text" placeholder="Email or username" />
  <input type="password" placeholder="Password" />

  <div class="button-row">
    <button class="login-btn"
      onclick="window.location.href='https://login.microsoftonline.com/'">
      Sign in
    </button>

    <button class="clear-btn">
      Clear
    </button>
  </div>

  <div class="footer">
    &copy; 2002–2026&nbsp;&nbsp;&nbsp;&nbsp;Loughery.com
  </div>

</div>

</body>
</html>
