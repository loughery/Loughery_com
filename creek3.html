<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Creek — Cinematic Loop</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  overflow: hidden;
}

video {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover; /* full hero mode */
  background: #000;
}
</style>
</head>

<body>

<video
  id="creek"
  src="Creek.mp4"
  preload="auto"
  autoplay
  playsinline
  muted
></video>

<script>
const video = document.getElementById("creek");

let forward = true;
let reversing = false;
let raf;
const normalSpeed = 1;
const slowSpeed = 0.35;
const easeZone = 1.0; // seconds near edges for slow motion
const audioDip = 0.4; // fade amount during reversal

video.volume = 1;
video.playbackRate = normalSpeed;

function easePlayback() {
  const t = video.currentTime;
  const d = video.duration;

  if (!d) return;

  if (forward) {
    const distanceToEnd = d - t;

    if (distanceToEnd < easeZone) {
      video.playbackRate = slowSpeed;
      video.volume = audioDip;
    } else {
      video.playbackRate = normalSpeed;
      video.volume = 1;
    }

    if (distanceToEnd <= 0.05) {
      startReverse();
    }

  } else {
    if (t < easeZone) {
      video.volume = audioDip;
    } else {
      video.volume = 1;
    }

    if (t <= 0.05) {
      forward = true;
      reversing = false;
      video.playbackRate = normalSpeed;
      video.volume = 1;
      video.play();
    }
  }
}

function startReverse() {
  forward = false;
  reversing = true;
  video.pause();
  reverseFrame();
}

function reverseFrame() {
  if (!reversing) return;

  video.currentTime -= 0.016 * slowSpeed;

  if (video.currentTime <= 0.05) {
    reversing = false;
    forward = true;
    video.play();
    return;
  }

  raf = requestAnimationFrame(reverseFrame);
}

video.addEventListener("loadedmetadata", () => {
  video.play();
});

video.addEventListener("timeupdate", easePlayback);

// Performance: pause RAF when hidden
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    cancelAnimationFrame(raf);
  }
});
</script>

</body>
</html>
