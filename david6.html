<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Writing Workshop with David C. O'Reilly | Deane Center</title>

<style>
:root{
  --ink:#111;
  --soft-ink:#2d2d2d;
  --paper:#f7f3eb;
  --line:#d9d0c2;
  --accent:#0067b8;
  --accent-dark:#004e8c;
  --muted:#666;
  --shadow:0 10px 30px rgba(0,0,0,.08);
  --max:1180px;

  /* FIXED */
  --header-offset:120px;
}

section{
  scroll-margin-top:var(--header-offset);
}

@media (max-width:640px){
  :root{ --header-offset:90px; }
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }

body{
  margin:0;
  background:var(--paper);
  font-family:Georgia, serif;
  line-height:1.65;
}

.wrap{
  width:min(var(--max), calc(100% - 32px));
  margin:0 auto;
}

.top-rule{
  height:8px;
  background:#000;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  background:rgba(247,243,235,.96);
  z-index:1000;
  border-bottom:1px solid var(--line);
}

.masthead{
  text-align:center;
  padding:18px 0;
}

.site-title{
  font-size:clamp(2rem,5vw,4rem);
  margin:0;
}

nav{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.nav-inner{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:10px 0;
}

/* HERO */
.hero{
  padding:40px 0;
}

.hero-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
  align-items:stretch;
}

/* FIXED: NO STICKY */
.info-card{
  background:#efe5d5;
  border-radius:20px;
  box-shadow:var(--shadow);
}

/* MOBILE */
@media(max-width:900px){
  .hero-grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="top-rule"></div>

<header>
  <div class="wrap masthead">
    <h1 class="site-title">The Writing Workshop</h1>
  </div>

  <nav>
    <div class="wrap nav-inner">
      <a href="#about">About</a>
      <a href="#register">Register</a>
    </div>
  </nav>
</header>

<main>

<section class="hero wrap" id="about">
  <div class="hero-grid">

    <div>
      <h2>How to Begin Writing</h2>
      <p>A free workshop at the Deane Center in Wellsboro.</p>
      <a href="#register">Register Now</a>
    </div>

    <aside class="info-card">
      <img src="public/images/david1.png" style="width:100%;">
    </aside>

  </div>
</section>

<section class="wrap" id="register">
  <h2>Register</h2>
  <form>
    <input placeholder="Name" required><br><br>
    <input placeholder="Email" required><br><br>
    <button>Submit</button>
  </form>
</section>

</main>

<footer class="wrap">
  <p>Deane Center • Wellsboro, PA</p>
</footer>

</body>
</html>
