<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Workshop</title>

<style>
:root{
--header-offset:140px;
}

html{scroll-behavior:smooth;}

body{
margin:0;
font-family:Georgia,serif;
background:#f7f3eb;
color:#111;
}

header{
position:sticky;
top:0;
background:#f7f3eb;
z-index:1000;
border-bottom:1px solid #ccc;
text-align:center;
padding:15px;
}

nav{
display:flex;
justify-content:center;
gap:20px;
padding:10px;
border-top:1px solid #ccc;
flex-wrap:wrap;
}

nav a{
text-decoration:none;
color:#111;
position:relative;
}

nav a.active{
font-weight:bold;
}

nav a.active::after{
content:"";
position:absolute;
bottom:-3px;
left:0;
width:100%;
height:1px;
background:#111;
}

section{
padding:80px 20px;
max-width:900px;
margin:auto;
scroll-margin-top:var(--header-offset);
}

/* reveal animation */
.reveal{
opacity:0;
transform:translateY(40px);
transition:all .8s ease;
}

.reveal.visible{
opacity:1;
transform:translateY(0);
}

@media(max-width:640px){
:root{--header-offset:110px;}
}

/* form */
form{
display:grid;
gap:10px;
}

input,textarea,select{
padding:12px;
border-radius:8px;
border:1px solid #ccc;
width:100%;
}

button{
padding:12px;
border:none;
background:#0067b8;
color:white;
border-radius:6px;
cursor:pointer;
}

.confirmation{
display:none;
background:white;
padding:20px;
border-radius:10px;
margin-top:20px;
}

.confirmation.show{display:block;}

</style>
</head>

<body>

<header>
<h1>Writing Workshop</h1>
<nav>
<a href="#about">About</a>
<a href="#learn">Learn</a>
<a href="#details">Details</a>
<a href="#register">Register</a>
</nav>
</header>

<section id="about" class="reveal">
<h2>About</h2>
<p>Workshop led by David C. O'Reilly at the Deane Center, Wellsboro PA.</p>
</section>

<section id="learn" class="reveal">
<h2>What You'll Learn</h2>
<p>Journaling and short story writing using paper and pencil.</p>
</section>

<section id="details" class="reveal">
<h2>Details</h2>
<p>July 10, 2026 at 1:00 PM. Free workshop.</p>
</section>

<section id="register" class="reveal">
<h2>Register</h2>

<form id="form">
<input name="name" placeholder="Name" required>
<input name="email" placeholder="Email" required>
<textarea name="notes" placeholder="Notes"></textarea>
<button type="submit">Register</button>
</form>

<div id="confirmation" class="confirmation">
<h3>Registration Confirmed</h3>
<p id="confText"></p>
<button onclick="window.print()">Print</button>
</div>

</section>

<script>
// reveal
const reveals=document.querySelectorAll('.reveal');
const obs=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting){e.target.classList.add('visible');}
});
},{threshold:.15});
reveals.forEach(r=>obs.observe(r));

// nav highlight
const sections=document.querySelectorAll('section');
const links=document.querySelectorAll('nav a');

const navObs=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting){
links.forEach(l=>l.classList.remove('active'));
let active=document.querySelector('nav a[href="#'+e.target.id+'"]');
if(active) active.classList.add('active');
}
});
},{threshold:.6});

sections.forEach(s=>navObs.observe(s));

// form submit (demo)
document.getElementById('form').addEventListener('submit',e=>{
e.preventDefault();
let name=e.target.name.value;
document.getElementById('confText').innerText="Thank you "+name+" for registering.";
document.getElementById('confirmation').classList.add('show');
e.target.style.display="none";
});
</script>

</body>
</html>
