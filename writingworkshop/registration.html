<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workshop Registration | Deane Center</title>

<style>
:root{
  --ink:#111;
  --paper:#f7f3eb;
  --accent:#b89c6d;
}

body{
  margin:0;
  font-family: Georgia, "Times New Roman", serif;
  background: var(--paper);
  color: var(--ink);
}

.container{
  max-width:700px;
  margin:60px auto;
  padding:30px;
}

h1{
  font-size:2rem;
  margin-bottom:10px;
}

p{
  line-height:1.6;
}

form{
  margin-top:25px;
}

input, textarea{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border:1px solid #ccc;
  font-size:1rem;
  background:white;

  /* MATCH SITE TYPOGRAPHY */
  font-family: Georgia, "Times New Roman", serif;
}

input:focus, textarea:focus{
  outline:none;
  border-color:var(--accent);
}

button{
  background:var(--ink);
  color:white;
  padding:12px 20px;
  border:none;
  cursor:pointer;
  font-size:1rem;
}

button:hover{
  background:#333;
}

.checkbox{
  display:flex;
  align-items:center;
  margin-bottom:15px;
}

.checkbox input{
  width:auto;
  margin-right:10px;
}
/*  NEW HOME BUTTON  */
.button-row{
  display:flex;
  gap:10px;
}

.home-btn{
  display:inline-block;
  background:var(--ink);
  color:white;
  padding:12px 20px;
  text-decoration:none;
  font-size:1rem;
}

.home-btn:hover{
  background:#333;
} 

/* ALLOW EQUAL SIZING */
.button-row button,
.button-row .home-btn{
  flex:1;
  text-align:center;
}  

@keyframes fadeSlideDown{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* BUTTON ROW */
.button-row{
  max-width:700px;
  margin:0 auto;
  display:flex;
  gap:10px;
}

/* MATCH BUTTON STYLES */
.button-row button,
.home-btn{
  flex:1;
  text-align:center;
  background:var(--ink);
  color:white;
  padding:12px 20px;
  border:none;
  font-size:1rem;
  text-decoration:none;
  cursor:pointer;
}

.button-row button:hover,
.home-btn:hover{
  background:#333;
}
.receipt-buttons{
  margin-top:20px;
  display:flex;
  gap:10px;
}

.receipt-buttons button,
.receipt-buttons .home-btn{
  flex:1;
  text-align:center;
}

/* Ensure home button matches */
.home-btn{
  display:inline-block;
  background:var(--ink);
  color:white;
  padding:12px 20px;
  text-decoration:none;
  font-size:1rem;
}

.home-btn:hover{
  background:#333;
}  

.receipt-buttons{
  border-top:1px solid rgba(0,0,0,0.08);
  padding-top:20px;
}
  
#receipt{
  display:none;
  margin-top:40px;
  padding:25px;
  background:white;
  border:1px solid #ddd;
}

.print-btn{
  height:44px;
}

/* ===== FIX RECEIPT BUTTON HEIGHT ===== */
.receipt-buttons button,
.receipt-buttons .home-btn{
  flex:1;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-sizing:border-box;
  padding:0 20px; /* override uneven padding */
  line-height:1;
}

@media print {
  body * { visibility: hidden; }
  #receipt, #receipt * { visibility: visible; }
  #receipt { position:absolute; left:0; top:0; width:100%; }
}
</style>
</head>

<body>

<div class="container">

<h1>Writing Workshop Registration</h1>
<p>
Join us for a free journaling and short story writing workshop led by David C. O'Reilly at the Deane Center in Wellsboro, Pennsylvania.
</p>

<form id="form" action="https://api.web3forms.com/submit" method="POST">

  <!-- REQUIRED WEB3FORMS FIELDS -->
  <input type="hidden" name="access_key" value="f7f9f99c-45aa-44f5-8057-9d058ffd057f">
  <input type="hidden" name="subject" value="New Workshop Registration">
  <input type="hidden" name="from_name" value="Workshop Registration">

  <!-- AUTORESPONDER -->
  <input type="hidden" name="replyto" value="">
  <input type="hidden" name="autoresponse" value="

CONFIRMATION – Writing Workshop Registration

Hello,

This message confirms your registration.

Event Details:
WHAT: Writing Workshop with David C. O'Reilly
WHEN: Friday, July 17, 2026
TIME: 1:00 PM
LOCATION: Deane Center, Wellsboro, PA

Please bring paper and pencil.

This is your official confirmation. You may print this email for your records.

We look forward to seeing you.
">

  <!-- USER INPUT -->
  <input type="text" name="First Name" placeholder="First Name" required autocomplete="off">
  <input type="text" name="Last Name" placeholder="Last Name" required autocomplete="off">
  <input type="email" name="email" placeholder="Email Address" required autocomplete="off">
  <textarea name="Comments" placeholder="Optional Comments"></textarea>

  <!-- REMINDER OPT-IN -->
  <div class="checkbox">
    <input type="checkbox" id="reminder" name="Reminder Opt-In">
    <label for="reminder">Send me a reminder before the event</label>
  </div>

<div class="button-row">
  <button type="submit">Register</button>
  <a href="index.html" class="home-btn">Back to Event Page</a>
</div>
</form>

<!-- RECEIPT -->
<div id="receipt">
  <h2>Registration Confirmed</h2>
  <p id="receiptText"></p>

  <div class="button-row receipt-buttons">
    <button class="print-btn" onclick="window.print()">Print Confirmation</button>
    <a href="index.html" class="home-btn">← Back to Event Page</a>
  </div>
</div>

</div>

<script>
const form = document.getElementById('form');
const receipt = document.getElementById('receipt');
const receiptText = document.getElementById('receiptText');

form.addEventListener('submit', async function(e){
  e.preventDefault();

  const formData = new FormData(form);

  // Set reply-to dynamically
  formData.set("replyto", formData.get("email"));

  const object = Object.fromEntries(formData);
/*  const json = JSON.stringify(object);

  const response = await fetch(form.action, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: json
  }); */
  
  const response = await fetch(form.action, {
  method: "POST",
  body: formData
});  

  if(response.ok){
    form.style.display = "none";

    receipt.style.display = "block";

    receiptText.innerHTML = `
      Thank you <strong>${object["First Name"]}</strong> for registering.<br><br>

      <strong>Event:</strong> Writing Workshop with David C. O'Reilly<br>
      <strong>Date:</strong> July 17, 2026<br>
      <strong>Time:</strong> 1:00 PM<br>
      <strong>Location:</strong> Deane Center, Wellsboro, PA<br><br>

      A confirmation email has been sent to <strong>${object["email"]}</strong>.<br><br>

      ${object["Reminder Opt-In"] ? "You will receive a reminder before the event." : ""}
    `;
  } else {
    alert("Something went wrong. Please try again.");
  }
});
</script>

</body>
</html>
