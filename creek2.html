<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Creek.mp4 — Autoplay Loop with Sound</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      width: min(100vw, 100vh * 16/9);
      max-width: 100vw;
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* change to 'cover' if you want edge-to-edge fill */
      background: #000;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(0deg, rgba(0,0,0,.45), rgba(0,0,0,.45));
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .btn {
      appearance: none;
      border: 0;
      padding: 0.9rem 1.25rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      background: #ffffff;
      color: #111;
      box-shadow: 0 6px 24px rgba(0,0,0,.35);
    }
    .btn:active { transform: translateY(1px); }
    .tip {
      position: absolute;
      bottom: .75rem;
      left: 50%;
      transform: translateX(-50%);
      color: #ddd;
      font-size: .85rem;
      text-align: center;
      padding: .25rem .5rem;
      background: rgba(0,0,0,.35);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <video
      id="creek"
      src="Creek.mp4"
      preload="auto"
      loop
      playsinline
      webkit-playsinline
      controls
    ></video>

    <!-- Shown only if autoplay-with-audio is blocked -->
    <div id="overlay" class="overlay">
      <button id="enableSound" class="btn" type="button">▶ Enable Sound</button>
      <div class="tip">Browsers sometimes block autoplay with audio. Tap to unmute.</div>
    </div>
  </div>

  <script>
    (async () => {
      const video = document.getElementById('creek');
      const overlay = document.getElementById('overlay');
      const enableBtn = document.getElementById('enableSound');

      // Prefer full volume unless the user changes it
      video.volume = 1.0;

      // Try autoplay WITH sound first
      try {
        video.muted = false;
        // Some browsers honor the autoplay attribute only after setting it true at runtime
        video.autoplay = true;

        // Attempt to play with sound
        await video.play();
        // Success: keep looping with sound
        overlay.classList.remove('show');
      } catch (err) {
        // Autoplay with sound blocked -> fall back to muted autoplay
        try {
          video.muted = true;
          await video.play();
        } catch (e) {
          // If even muted autoplay is blocked, we'll rely on the user's click anyway
        }
        overlay.classList.add('show');
      }

      // On user gesture, unmute and keep looping
      enableBtn.addEventListener('click', async () => {
        try {
          video.muted = false;
          await video.play(); // user gesture should allow audio
          overlay.classList.remove('show');
        } catch (err) {
          // If still blocked, keep overlay visible but make sure video is playing muted
          video.muted = true;
          try { await video.play(); } catch (_) {}
          overlay.classList.add('show');
        }
      });

      // Extra resilience: if some UA mishandles 'loop', force replay on 'ended'
      video.addEventListener('ended', () => {
        // Should not fire with 'loop', but just in case:
        video.currentTime = 0;
        video.play().catch(() => {/* ignore */});
      });

      // If page visibility or audio policies pause the video, try to resume silently
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && video.paused) {
          video.play().catch(() => {/* may still be blocked until gesture */});
        }
      });
    })();
  </script>
</body>
</html>
