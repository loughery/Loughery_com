<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loughery Professional Services, LLC</title>

<style>

/* ===== BASE ===== */
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif;
background:#ffffff;
color:#1b1b1b;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
}

/* ===== CARD ===== */
.container{
width:100%;
max-width:520px;
padding:clamp(28px,6vw,60px);
border-radius:18px;
background:#ffffff;
border:1px solid #c8c8c8;
box-shadow:0 18px 40px rgba(0,0,0,0.08);
text-align:center;
animation:cardFade 1s ease forwards;
opacity:0;
transform:translateY(6px);
}

@keyframes cardFade{
to{opacity:1;transform:translateY(0);}
}

/* ===== ACCENT LINE ===== */
.accent{
height:3px;
width:0;
margin:0 auto 32px auto;
border-radius:3px;
background:linear-gradient(90deg,#0078d4,#4aa3ff);
animation:growLine 2s ease forwards;
}

@keyframes growLine{
from{width:0;}
to{width:160px;}
}

/* ===== HEADER ===== */
h1{
font-weight:600;
font-size:clamp(20px,4vw,26px);
letter-spacing:.04em;
margin:0 0 36px 0;
line-height:1.3;
}

/* ===== INPUTS ===== */
input{
width:100%;
padding:14px;
margin-bottom:20px;
font-size:15px;
border-radius:8px;
border:1px solid #dcdcdc;
background:#fafafa;
transition:all .25s ease;
}

input:focus{
outline:none;
border-color:#0078d4;
box-shadow:0 0 0 3px rgba(0,120,212,.15);
background:#ffffff;
}

/* ===== BUTTONS ===== */
.button-row{
display:flex;
gap:16px;
}

button{
flex:1;
padding:14px 0;
font-size:15px;
border-radius:8px;
cursor:pointer;
transition:all .25s ease;
border:none;
}

.login-btn{
background:linear-gradient(135deg,#0078d4,#005fa3);
color:white;
}

.login-btn:hover{
box-shadow:0 8px 18px rgba(0,120,212,.3);
transform:translateY(-1px);
}

.clear-btn{
background:#f2f2f2;
color:#444;
border:1px solid #d0d0d0;
}

.clear-btn:hover{
background:#e6e6e6;
transform:translateY(-1px);
}

/* ===== FOOTER ===== */
.footer-divider{
width:60%;
height:1px;
margin:48px auto 16px auto;
background:#e0e0e0;
}

.footer{
font-size:12px;
letter-spacing:.08em;
color:#666;
}

.rights{
margin-top:6px;
font-size:12px;
letter-spacing:.08em;
font-weight:400;
color:#999;
}

.timestamp{
margin-top:8px;
font-size:11px;
font-style:italic;
color:#777;
letter-spacing:.05em;
}

/* ===== MOBILE ===== */
@media(max-width:600px){

body{
align-items:flex-start;
padding-top:60px;
}

.button-row{
flex-direction:column;
}

button{
width:100%;
}

}

</style>
</head>

<body>

<div class="container">

<div class="accent"></div>

<h1>Loughery Professional Services, LLC</h1>

<form autocomplete="off">

<!-- Hidden autofill traps -->
<input type="text" style="display:none">
<input type="password" style="display:none">

<input
type="text"
id="username"
name="user_field"
placeholder="Email or username"
autocomplete="off"
autocorrect="off"
autocapitalize="none"
spellcheck="false"
/>

<input
type="password"
id="password"
name="pass_field"
placeholder="Password"
autocomplete="new-password"
/>

<div class="button-row">

<button
type="button"
class="login-btn"
onclick="window.location.href='https://login.microsoftonline.com/'">
M365 Sign in
</button>

<button
type="button"
class="clear-btn"
onclick="clearFields()">
Clear
</button>

</div>

</form>

<div class="footer-divider"></div>

<div class="footer">
&copy; 2002–2026&nbsp;&nbsp;&nbsp;&nbsp;Loughery.com
</div>

<div class="rights">
All Rights Reserved
</div>

<div class="timestamp" id="lastModified"></div>

</div>

<script>

/* ===== CLEAR BUTTON ===== */
function clearFields(){
document.getElementById("username").value="";
document.getElementById("password").value="";
}

/* ===== FORCE EMPTY FIELDS ON LOAD ===== */
window.onload=function(){
document.getElementById("username").value="";
document.getElementById("password").value="";
}

/* ===== LAST MODIFIED TIMESTAMP ===== */

const lastModified=new Date(document.lastModified);

const formatter=new Intl.DateTimeFormat('en-US',{
timeZone:'America/New_York',
month:'short',
day:'2-digit',
year:'numeric',
hour:'numeric',
minute:'2-digit',
hour12:true,
timeZoneName:'short'
});

const parts=formatter.formatToParts(lastModified);

let v={};
parts.forEach(p=>v[p.type]=p.value);

const formatted=
`${v.month} ${v.day}, ${v.year} — ${v.hour}:${v.minute} ${v.dayPeriod} ${v.timeZoneName}`;

document.getElementById("lastModified").textContent=
"Last update: "+formatted;

</script>

</body>
</html>
